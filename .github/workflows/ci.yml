name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Keep private copies manual-only; the public beta runs on pushes and PRs.
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AUDIOLAB_RUN_AI_TESTS: "0"
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # detects ES modules without a package.json
      - name: JavaScript syntax
        run: find audiolab/web -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Launcher syntax
        run: bash -n start.sh && bash -n AudioLab.command
      - run: python -m pytest
