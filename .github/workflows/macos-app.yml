name: Build macOS tester app

'on':
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create an unpublished GitHub release draft for the selected version tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    # Native validation runs on macOS 15; the deployment target remains macOS 14.
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      manifest_sha256: ${{ steps.draft_artifacts.outputs.manifest_sha256 }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      UV_NO_PROGRESS: "1"
      AUDIOLAB_BUILD_JOBS: "3"
    steps:
      - name: Initialize isolated build paths
        run: |
          printf '%s\n' \
            "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/audiolab-python" \
            "UV_CACHE_DIR=$RUNNER_TEMP/audiolab-uv-cache" \
            "AUDIOLAB_PACKAGE_WORK_DIR=$RUNNER_TEMP/audiolab-package" \
            "VALIDATION_DIR=$RUNNER_TEMP/audiolab-validation" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/audiolab-validation"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify the draft release tag
        if: inputs.create_draft
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Select an existing vX.Y.Z tag to create a release draft." >&2
            exit 1
          fi
          version="$(python3 -c 'from audiolab import __version__; print(__version__)')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ||
                "$(git rev-parse "$GITHUB_REF^{commit}")" != "$GITHUB_SHA" ||
                "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "The release tag, source version and checked-out commit must match." >&2
            exit 1
          fi

      - name: Record build host and source
        run: |
          mkdir -p "$VALIDATION_DIR"
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]]
          {
            uname -a
            sw_vers
            xcodebuild -version
            git rev-parse HEAD
          } > "$VALIDATION_DIR/host-and-source.txt"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false

      - name: Install the reviewed standalone Python build
        run: |
          # Python's version alone does not pin the standalone build or its native libraries.
          cat > "$VALIDATION_DIR/python-downloads.json" <<'JSON'
          {
            "cpython-3.12.15-darwin-aarch64-none": {
              "name": "cpython",
              "arch": {"family": "aarch64", "variant": null},
              "os": "darwin", "libc": "none",
              "major": 3, "minor": 12, "patch": 15, "prerelease": "",
              "url": "https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.12.15%2B20261001-aarch64-apple-darwin-install_only.tar.gz",
              "sha256": "f1ee170bd7bb45bea526c4f9489b41f9c5d978c4cd7a08fd11809de56c39b736",
              "variant": null, "build": "20261001"
            }
          }
          JSON
          uv --no-config python install --no-bin \
            --python-downloads-json-url "$VALIDATION_DIR/python-downloads.json" \
            cpython-3.12.15-macos-aarch64-none 2>&1 | tee "$VALIDATION_DIR/python-install.log"
          build_python="$(uv --no-config python find --managed-python cpython-3.12.15-macos-aarch64-none)"
          printf '%s\n' "AUDIOLAB_BUILD_PYTHON=$build_python" >> "$GITHUB_ENV"
          "$build_python" - <<'PY'
          import json
          import os
          import platform
          import sys
          from pathlib import Path

          build = (Path(sys.base_prefix) / 'BUILD').read_text().strip()
          assert sys.version_info[:3] == (3, 12, 15), sys.version
          assert platform.machine() == 'arm64', platform.machine()
          assert build == '20261001', build
          report = {'version': sys.version, 'executable': sys.executable, 'base_prefix': sys.base_prefix,
                    'machine': platform.machine(), 'standalone_build': build}
          (Path(os.environ['VALIDATION_DIR']) / 'python-provenance.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Seed verified core sources from the retained companion
        run: |
          seed_dir="$RUNNER_TEMP/audiolab-source-seed"
          mkdir -p "$seed_dir"
          seed_archive="$seed_dir/AudioLab-2.4.0b2-third-party-sources-arm64.tar.gz"
          curl --fail --show-error --location --retry 3 --retry-delay 2 \
            --retry-max-time 660 --connect-timeout 30 --max-time 300 \
            --output "$seed_archive" \
            "https://github.com/JSummerer/AudioLab/releases/download/v2.4.0b2/AudioLab-2.4.0b2-third-party-sources-arm64.tar.gz"
          printf '%s  %s\n' \
            'e8de816a15578798197352a54b7530e8b9d227c6adeb8c98f6b06c1e453150f7' \
            "$seed_archive" | shasum -a 256 --check
          "$AUDIOLAB_BUILD_PYTHON" packaging/macos/seed_sources.py \
            "$seed_archive" "$AUDIOLAB_PACKAGE_WORK_DIR/media/downloads" \
            2>&1 | tee "$VALIDATION_DIR/source-cache-seed.log"

      - name: Build the app, DMG and matching sources
        run: bash packaging/macos/build.sh 2>&1 | tee "$VALIDATION_DIR/build.log"

      - name: Validate the actual packaged WebKit window
        run: |
          "$AUDIOLAB_BUILD_PYTHON" - <<'PY'
          import json
          import os
          import signal
          import subprocess
          from pathlib import Path

          evidence = Path(os.environ['VALIDATION_DIR'])
          executable = Path(os.environ['AUDIOLAB_PACKAGE_WORK_DIR']) / 'dist/AudioLab.app/Contents/MacOS/AudioLab'
          isolated = Path(os.environ['RUNNER_TEMP']) / 'audiolab-native'
          env = dict(os.environ, PATH='/usr/bin:/bin:/usr/sbin:/sbin',
                     AUDIOLAB_DATA_DIR=str(isolated / 'data'), AUDIOLAB_OUTPUT_DIR=str(isolated / 'output'))
          for name in ('PYTHONPATH', 'PYTHONHOME', 'AUDIOLAB_TOKEN', 'AUDIOLAB_FFMPEG'):
              env.pop(name, None)
          with (evidence / 'native-smoke.log').open('w') as log:
              child = subprocess.Popen([str(executable), '--audiolab-native-smoke'], env=env,
                                       stdout=log, stderr=subprocess.STDOUT, text=True, start_new_session=True)
              try:
                  code = child.wait(timeout=120)
              except subprocess.TimeoutExpired:
                  os.killpg(child.pid, signal.SIGTERM)
                  try:
                      child.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      os.killpg(child.pid, signal.SIGKILL)
                      child.wait(timeout=5)
                  raise RuntimeError('The packaged WebKit check did not finish within 120 seconds.') from None
          text = (evidence / 'native-smoke.log').read_text()
          print(text)
          assert code == 0, f'Packaged WebKit smoke exited with {code}; see native-smoke.log'
          # The command prints its final structured result after any library messages.
          start = text.find('{\n  "ok":')
          assert start >= 0, 'The native check did not produce structured results.'
          result = json.JSONDecoder().raw_decode(text[start:])[0]
          assert result['ok'] and result['backend'] == 'wkwebview'
          assert result['window_closed'] and result['server_stopped']
          (evidence / 'native-smoke.json').write_text(json.dumps(result, indent=2) + '\n')
          PY

      - name: Record the draft artifact identity
        if: inputs.create_draft
        id: draft_artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          release="$AUDIOLAB_PACKAGE_WORK_DIR/release-$version-arm64"
          "$AUDIOLAB_BUILD_PYTHON" - "$version" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          work = Path(os.environ['AUDIOLAB_PACKAGE_WORK_DIR'])
          info_path = work / 'dist/AudioLab.app/Contents/Resources/build-info.json'
          info = json.loads(info_path.read_text())
          if (info.get('version'), info.get('commit'), info.get('architecture')) != (
              sys.argv[1], os.environ['GITHUB_SHA'], 'arm64'
          ):
              sys.exit('The packaged app does not match the checked version and commit.')
          PY
          hdiutil verify "$release/AudioLab-$version-macOS-arm64.dmg"
          manifest="$(shasum -a 256 "$release/SHA256SUMS.txt")"
          printf 'manifest_sha256=%s\nrelease_dir=%s\n' "${manifest%% *}" "${release##*/}" >> "$GITHUB_OUTPUT"

      - name: Upload validated release files
        uses: actions/upload-artifact@v7
        with:
          name: AudioLab-macOS-arm64-${{ github.run_id }}
          path: |
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/${{ steps.draft_artifacts.outputs.release_dir || 'release-*' }}/*.dmg
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/${{ steps.draft_artifacts.outputs.release_dir || 'release-*' }}/*.tar.gz
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/${{ steps.draft_artifacts.outputs.release_dir || 'release-*' }}/ai-catalog.json
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/${{ steps.draft_artifacts.outputs.release_dir || 'release-*' }}/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload validation evidence and failure logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AudioLab-macOS-validation-${{ github.run_id }}
          path: |
            ${{ env.VALIDATION_DIR }}/
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/release-*/smoke/*.log
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/release-*/smoke/*.json
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/release-*/ai-smoke/*.json
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/release-*/ai-smoke/*.log
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/ai/release/inventory.json
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/ai/evidence/
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/ai/smoke/*.json
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/ai/smoke/*.stdout
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/ai/smoke/*.stderr
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/media/evidence/ffmpeg-version.txt
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/media/evidence/ffmpeg-license.txt
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/media/evidence/dynamic-libraries.txt
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/media/evidence/compiler.txt
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/media/evidence/build-system.txt
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/pyinstaller-work/AudioLab/warn-AudioLab.txt
            ${{ env.AUDIOLAB_PACKAGE_WORK_DIR }}/*inventory*.json
            ${{ runner.temp }}/audiolab-native/data/logs/
          if-no-files-found: warn
          retention-days: 7

  draft:
    name: Create release draft
    if: inputs.create_draft
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: macos-release-draft-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download this run's validated release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "AudioLab-macOS-arm64-$GITHUB_RUN_ID" --dir "$RUNNER_TEMP/release"

      - name: Verify the exact release assets
        env:
          VERIFIED_MANIFEST: ${{ needs.package.outputs.manifest_sha256 }}
        run: |
          cd "$RUNNER_TEMP/release"
          manifest="$(sha256sum SHA256SUMS.txt)"
          if [[ "${manifest%% *}" != "$VERIFIED_MANIFEST" ]]; then
            echo "The artifact checksum file differs from the validated build." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          # Check the expected regular files and the paths in the checksum manifest before reading them.
          python3 - "$version" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          expected = {
              f'AudioLab-{version}-macOS-arm64.dmg',
              f'AudioLab-{version}-third-party-sources-arm64.tar.gz',
              'ai-catalog.json',
          }
          manifest = Path('SHA256SUMS.txt')
          files = list(Path('.').iterdir())
          if (
              {path.name for path in files} != expected | {manifest.name}
              or any(path.is_symlink() or not path.is_file() or not path.stat().st_size for path in files)
          ):
              sys.exit('The build must provide only the new DMG, core sources, catalog and checksums.')
          rows = [re.fullmatch(r'[0-9a-f]{64}  \./([^/]+)', line) for line in manifest.read_text().splitlines()]
          if len(rows) != len(expected) or {row[1] for row in rows if row} != expected:
              sys.exit('The checksum manifest does not cover exactly the expected release files.')
          PY
          sha256sum --check --strict SHA256SUMS.txt

      - name: Create a new unpublished release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release"
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          existing="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[][] | .tag_name')"
          if grep -Fxq -- "$tag" <<< "$existing"; then
            echo "A draft or published release already exists for $tag." >&2
            exit 1
          fi
          # Ensure the remote tag has not moved during the build. An annotated tag needs its peeled commit.
          remote="$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            "$GITHUB_REF" "$GITHUB_REF^{}")"
          commit="$(awk -v ref="$GITHUB_REF" '$2 == ref {tag = $1} $2 == ref "^{}" {peeled = $1}
            END {print (peeled ? peeled : tag)}' <<< "$remote")"
          if [[ "$commit" != "$GITHUB_SHA" ]]; then
            echo "$tag no longer points to the validated commit." >&2
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "AudioLab $version (beta)" --generate-notes \
            "AudioLab-$version-macOS-arm64.dmg" "AudioLab-$version-third-party-sources-arm64.tar.gz" \
            ai-catalog.json SHA256SUMS.txt
